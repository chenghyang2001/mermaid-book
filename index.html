<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mermaid 教學書圖表瀏覽器</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #0f172a; color: #e2e8f0; font-family: 'Segoe UI', system-ui, sans-serif; height: 100vh; display: flex; flex-direction: column; overflow: hidden; user-select: none; }

    /* Header */
    #header { padding: 9px 16px; background: rgba(0,0,0,0.6); border-bottom: 1px solid #1e293b; display: flex; align-items: center; gap: 12px; flex-shrink: 0; min-height: 42px; }
    #ch-label { font-weight: 700; color: #38bdf8; font-size: 0.85rem; white-space: nowrap; }
    #topic-label { font-size: 0.8rem; color: #94a3b8; white-space: nowrap; }
    #img-label { font-size: 0.85rem; font-weight: 600; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    #counter { font-size: 0.8rem; color: #64748b; white-space: nowrap; }

    /* Progress bar (autoplay countdown) */
    #progress-bar {
      height: 3px;
      background: linear-gradient(90deg, #38bdf8, #7dd3fc);
      width: 0%;
      flex-shrink: 0;
      display: none;
    }

    /* Main layout */
    #main { flex: 1; display: flex; overflow: hidden; }

    /* Sidebar */
    #sidebar { width: 160px; flex-shrink: 0; background: rgba(0,0,0,0.45); border-right: 1px solid #1e293b; overflow-y: auto; scrollbar-width: thin; scrollbar-color: #1e293b transparent; }
    .ch-btn { width: 100%; padding: 10px 12px; display: flex; align-items: center; justify-content: space-between; cursor: pointer; border: none; background: none; color: #94a3b8; font-size: 0.78rem; text-align: left; border-bottom: 1px solid #1e293b; transition: background 0.15s, color 0.15s; }
    .ch-btn:hover { background: rgba(56,189,248,0.07); color: #e2e8f0; }
    .ch-btn.active { background: rgba(56,189,248,0.12); color: #38bdf8; border-left: 3px solid #38bdf8; }
    .ch-btn .ch-name { font-weight: 600; display: block; }
    .ch-btn .ch-sub { font-size: 0.68rem; color: #475569; margin-top: 2px; display: block; }
    .ch-btn .ch-count { background: #1e293b; color: #64748b; font-size: 0.68rem; padding: 1px 6px; border-radius: 10px; flex-shrink: 0; }
    .ch-btn.active .ch-count { background: rgba(56,189,248,0.2); color: #38bdf8; }

    /* Viewer */
    #viewer { flex: 1; position: relative; overflow: hidden; background: #0f172a; cursor: grab; }
    #viewer.dragging { cursor: grabbing; }
    #main-img { position: absolute; left: 0; top: 0; transform-origin: 0 0; will-change: transform; max-width: none; max-height: none; transition: opacity 0.15s; pointer-events: none; }
    #scale-badge { position: absolute; bottom: 10px; right: 10px; background: rgba(0,0,0,0.65); color: #64748b; font-size: 0.68rem; padding: 2px 7px; border-radius: 4px; pointer-events: none; z-index: 5; }

    /* Nav buttons */
    .nav-btn { position: absolute; top: 50%; transform: translateY(-50%); background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.1); color: #e2e8f0; font-size: 1.3rem; width: 40px; height: 72px; cursor: pointer; border-radius: 7px; z-index: 10; transition: background 0.15s; display: flex; align-items: center; justify-content: center; }
    .nav-btn:hover { background: rgba(255,255,255,0.18); }
    #prev-btn { left: 8px; }
    #next-btn { right: 8px; }

    /* Thumbnails */
    #thumbnails { display: flex; gap: 5px; padding: 7px 10px; background: rgba(0,0,0,0.55); border-top: 1px solid #1e293b; overflow-x: auto; flex-shrink: 0; scrollbar-width: thin; scrollbar-color: #1e293b transparent; }
    .thumb { width: 64px; height: 42px; object-fit: cover; border-radius: 3px; cursor: pointer; opacity: 0.38; border: 2px solid transparent; transition: opacity 0.15s, border-color 0.15s; flex-shrink: 0; }
    .thumb.active { opacity: 1; border-color: #38bdf8; }
    .thumb:hover:not(.active) { opacity: 0.72; }

    /* ── Autoplay controls ── */
    #autoplay-wrap {
      position: relative;
      display: flex;
      align-items: center;
      flex-shrink: 0;
    }

    #play-btn {
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 4px 10px;
      background: rgba(56,189,248,0.08);
      border: 1px solid rgba(56,189,248,0.28);
      border-right: none;
      border-radius: 6px 0 0 6px;
      color: #7dd3fc;
      font-size: 0.76rem;
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
      white-space: nowrap;
    }
    #play-btn:hover { background: rgba(56,189,248,0.18); color: #e0f2fe; }
    #play-btn.playing { background: rgba(56,189,248,0.2); color: #38bdf8; font-weight: 600; }

    #dd-toggle {
      padding: 4px 8px;
      background: rgba(56,189,248,0.08);
      border: 1px solid rgba(56,189,248,0.28);
      border-radius: 0 6px 6px 0;
      color: #7dd3fc;
      font-size: 0.72rem;
      cursor: pointer;
      transition: background 0.15s;
      line-height: 1.6;
    }
    #dd-toggle:hover { background: rgba(56,189,248,0.18); color: #e0f2fe; }

    #auto-dropdown {
      position: absolute;
      top: calc(100% + 6px);
      right: 0;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 5px 0;
      min-width: 148px;
      z-index: 200;
      box-shadow: 0 8px 28px rgba(0,0,0,0.55);
      display: none;
    }
    #auto-dropdown.open { display: block; }

    .dd-speed {
      padding: 7px 16px 7px 34px;
      font-size: 0.79rem;
      color: #94a3b8;
      cursor: pointer;
      transition: background 0.1s, color 0.1s;
      white-space: nowrap;
      position: relative;
    }
    .dd-speed:hover { background: rgba(255,255,255,0.06); color: #e2e8f0; }
    .dd-speed.active { color: #38bdf8; font-weight: 600; }
    .dd-speed.active::before { content: '✓'; position: absolute; left: 14px; color: #38bdf8; }

    .dd-divider { height: 1px; background: #334155; margin: 5px 0; }

    .dd-loop {
      padding: 7px 16px;
      font-size: 0.79rem;
      color: #94a3b8;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: background 0.1s, color 0.1s;
    }
    .dd-loop:hover { background: rgba(255,255,255,0.06); color: #e2e8f0; }
    .dd-loop.active { color: #38bdf8; }

    .loop-check {
      width: 14px;
      height: 14px;
      border: 1.5px solid #475569;
      border-radius: 3px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.6rem;
      flex-shrink: 0;
      transition: border-color 0.15s, background 0.15s;
    }
    .dd-loop.active .loop-check { border-color: #38bdf8; background: rgba(56,189,248,0.18); color: #38bdf8; }
    .dd-loop.active .loop-check::after { content: '✓'; }
    .dd-mode { padding: 7px 16px 7px 34px; font-size: 0.79rem; color: #94a3b8; cursor: pointer; position: relative; }
    .dd-mode:hover { background: rgba(255,255,255,0.06); color: #e2e8f0; }
    .dd-mode.active { color: #38bdf8; font-weight: 600; }
    .dd-mode.active::before { content: '✓'; position: absolute; left: 14px; color: #38bdf8; }
  </style>
</head>

<div id="header">

  <div id="autoplay-wrap">

      <div class="dd-speed" data-ms="15000">每隔 15 秒</div>
      <div class="dd-speed" data-ms="30000">每隔 30 秒</div>
      <div class="dd-divider"></div>
      <div class="dd-loop active" id="loop-item"><span class="loop-check"></span>循環播放</div>
      <div class="dd-divider"></div>
      <div class="dd-mode active" data-mode="chapter">本章循環</div>
      <div class="dd-mode" data-mode="book">全書連播</div>
    </div>
  </div>
</div>

<div id="progress-bar"></div>

<div id="main">

  </div>

// ── State ──────────────────────────────────────────────────
let chIdx = 0, imgIdx = 0;
let scale = 1, tx = 0, ty = 0;
let dragging = false, dragX = 0, dragY = 0, txStart = 0, tyStart = 0;

// ── Autoplay state ─────────────────────────────────────────
let autoSpeed = 5000;
let autoLoop  = true;
let playMode  = 'chapter';
let autoTimer = null;
let progTimer = null;
let progStart = 0;

// ── Elements ───────────────────────────────────────────────
const img        = document.getElementById('main-img');
const viewer     = document.getElementById('viewer');
const sidebar    = document.getElementById('sidebar');
const thumbsEl   = document.getElementById('thumbnails');
const chLabel    = document.getElementById('ch-label');
const topicLabel = document.getElementById('topic-label');
const imgLabel   = document.getElementById('img-label');
const counter    = document.getElementById('counter');
const badge      = document.getElementById('scale-badge');
const playBtn    = document.getElementById('play-btn');
const ddToggle   = document.getElementById('dd-toggle');
const dropdown   = document.getElementById('auto-dropdown');
const progBar    = document.getElementById('progress-bar');
const loopItem   = document.getElementById('loop-item');

// ── Build sidebar ──────────────────────────────────────────
CHAPTERS.forEach((ch, ci) => {
  const btn = document.createElement('button');
  btn.className = 'ch-btn' + (ci === 0 ? ' active' : '');
  btn.innerHTML = `<span><span class="ch-name">${ch.label}</span><span class="ch-sub">${ch.name}</span></span><span class="ch-count">${ch.images.length}</span>`;
  btn.addEventListener('click', () => loadChapter(ci, 0));
  sidebar.appendChild(btn);
});

// ── Transform ──────────────────────────────────────────────
function applyTransform() {
  img.style.transform = `matrix(${scale},0,0,${scale},${tx},${ty})`;
  badge.textContent = Math.round(scale * 100) + '%';
}

function fitImage() {
  const vw = viewer.clientWidth, vh = viewer.clientHeight;
  const iw = img.naturalWidth,   ih = img.naturalHeight;
  if (!iw || !ih) return;
  const PAD = 20;
  scale = Math.min((vw - PAD*2) / iw, (vh - PAD*2) / ih);
  tx = (vw - iw * scale) / 2;
  ty = (vh - ih * scale) / 2;
  applyTransform();
}

// ── Autoplay functions ─────────────────────────────────────
function startAutoplay() {
  clearInterval(autoTimer);
  clearInterval(progTimer);
  progStart = Date.now();
  autoTimer = setInterval(autoAdvance, autoSpeed);
  progTimer = setInterval(updateProgress, 50);
  progBar.style.display = 'block';
  progBar.style.width   = '0%';
  playBtn.textContent = '⏸ 暫停';
  playBtn.classList.add('playing');
}

function stopAutoplay() {
  clearInterval(autoTimer);
  clearInterval(progTimer);
  autoTimer = progTimer = null;
  progBar.style.width   = '0%';
  progBar.style.display = 'none';
  playBtn.textContent = '▶ 自動播放';
  playBtn.classList.remove('playing');
}

function updateProgress() {
  const pct = Math.min(((Date.now() - progStart) / autoSpeed) * 100, 100);
  progBar.style.width = pct + '%';
}

function autoAdvance() {
  const total = CHAPTERS[chIdx].images.length;
  const isLast = imgIdx >= total - 1;
  if (isLast && playMode === 'book') { loadChapter((chIdx + 1) % CHAPTERS.length, 0); startAutoplay(); return; }
  if (isLast && !autoLoop) { stopAutoplay(); return; }
  // showImage handles the modulo wrap for loop case
  showImage(chIdx, imgIdx + 1);
}

function resetAutoTimer() {
  if (!autoTimer) return;
  clearInterval(autoTimer);
  clearInterval(progTimer);
  progStart = Date.now();
  autoTimer = setInterval(autoAdvance, autoSpeed);
  progTimer = setInterval(updateProgress, 50);
  progBar.style.width = '0%';
}

// ── Autoplay event handlers ────────────────────────────────
playBtn.addEventListener('click', () => {
  autoTimer ? stopAutoplay() : startAutoplay();
});

ddToggle.addEventListener('click', e => {
  e.stopPropagation();
  dropdown.classList.toggle('open');
});

document.querySelectorAll('.dd-speed').forEach(el => {
  el.addEventListener('click', () => {
    autoSpeed = parseInt(el.dataset.ms);
    document.querySelectorAll('.dd-speed').forEach(s => s.classList.remove('active'));
    el.classList.add('active');
    if (autoTimer) startAutoplay();  // restart with new speed
    dropdown.classList.remove('open');
  });
});

loopItem.addEventListener('click', () => {
  autoLoop = !autoLoop;
  loopItem.classList.toggle('active', autoLoop);
});

document.querySelectorAll('.dd-mode').forEach(el => {
  el.addEventListener('click', () => {
    playMode = el.dataset.mode;
    document.querySelectorAll('.dd-mode').forEach(m => m.classList.toggle('active', m === el));
  });
});

document.addEventListener('click', e => {
  if (!document.getElementById('autoplay-wrap').contains(e.target)) {
    dropdown.classList.remove('open');
  }
});

// ── Load chapter ───────────────────────────────────────────
function loadChapter(ci, ii) {
  stopAutoplay();
  chIdx = ci; imgIdx = ii;
  document.querySelectorAll('.ch-btn').forEach((b, i) => b.classList.toggle('active', i === ci));

  thumbsEl.innerHTML = '';
  CHAPTERS[ci].images.forEach((item, i) => {
    const t = document.createElement('img');
    t.src = item.f; t.className = 'thumb' + (i === ii ? ' active' : ''); t.title = item.l;
    t.addEventListener('click', () => showImage(ci, i));
    thumbsEl.appendChild(t);
  });

  showImage(ci, ii);
}

// ── Show image ─────────────────────────────────────────────
function showImage(ci, ii) {
  chIdx = ci;
  imgIdx = ((ii % CHAPTERS[ci].images.length) + CHAPTERS[ci].images.length) % CHAPTERS[ci].images.length;
  const item = CHAPTERS[ci].images[imgIdx];

  img.style.opacity = '0';
  img.src = item.f;
  img.onload = () => { fitImage(); img.style.opacity = '1'; };

  chLabel.textContent    = CHAPTERS[ci].label + ' ' + CHAPTERS[ci].name;
  topicLabel.textContent = item.t ? '› ' + item.t : '';
  imgLabel.textContent   = item.l;
  counter.textContent    = `${imgIdx + 1} / ${CHAPTERS[ci].images.length}`;

  document.querySelectorAll('.thumb').forEach((t, i) => {
    t.classList.toggle('active', i === imgIdx);
    if (i === imgIdx) t.scrollIntoView({ behavior:'smooth', block:'nearest', inline:'center' });
  });

  resetAutoTimer();
}

// Init
loadChapter(0, 0);

// ── Keyboard ───────────────────────────────────────────────
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight')              showImage(chIdx, imgIdx + 1);
  else if (e.key === 'ArrowLeft')          showImage(chIdx, imgIdx - 1);
  else if (e.key === ' ') {
    if (e.target.tagName === 'BUTTON') return;
    e.preventDefault();
    autoTimer ? stopAutoplay() : startAutoplay();
  }
  else if (e.key === 'Escape' || e.key === '0') fitImage();
});

document.getElementById('prev-btn').addEventListener('click', () => showImage(chIdx, imgIdx - 1));
document.getElementById('next-btn').addEventListener('click', () => showImage(chIdx, imgIdx + 1));

// ── Scroll zoom (cursor-centred) ───────────────────────────
viewer.addEventListener('wheel', e => {
  e.preventDefault();
  const factor = e.deltaY < 0 ? 1.13 : 1/1.13;
  const ns = Math.min(Math.max(scale * factor, 0.1), 25);
  const vr = viewer.getBoundingClientRect();
  const cx = e.clientX - vr.left, cy = e.clientY - vr.top;
  tx = cx - (cx - tx) * (ns / scale);
  ty = cy - (cy - ty) * (ns / scale);
  scale = ns;
  applyTransform();
}, { passive: false });

// ── Drag pan ───────────────────────────────────────────────
viewer.addEventListener('mousedown', e => {
  if (e.button !== 0 || e.target.classList.contains('nav-btn')) return;
  dragging = true; dragX = e.clientX; dragY = e.clientY; txStart = tx; tyStart = ty;
  viewer.classList.add('dragging');
});
document.addEventListener('mousemove', e => {
  if (!dragging) return;
  tx = txStart + (e.clientX - dragX); ty = tyStart + (e.clientY - dragY);
  applyTransform();
});
document.addEventListener('mouseup', () => { dragging = false; viewer.classList.remove('dragging'); });

// ── Double-click reset ─────────────────────────────────────
viewer.addEventListener('dblclick', fitImage);
window.addEventListener('resize', fitImage);
</script>
</body>
</html>
